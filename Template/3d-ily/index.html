<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Love Heart</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(135deg, #2a0810 0%, #1a0408 100%);
  font-family: 'Arial', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

#canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.hidden {
  display: none !important;
}

/* ---------- Loading + gate ---------- */
#gate {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  background: radial-gradient(circle at 50% 50%, #3a0c16 0%, #1a0408 65%, #0d0205 100%);
  transition: opacity 900ms ease;
  opacity: 1;
}

#gate.fade-out {
  opacity: 0;
}

.gate-heart {
  width: 30px;
  height: 30px;
  transform: rotate(-45deg);
  background: #ff6482;
  position: relative;
  box-shadow: 0 0 30px rgba(255, 100, 130, 0.7);
  animation: pulse 2.2s ease-in-out infinite;
}

.gate-heart::before,
.gate-heart::after {
  content: "";
  position: absolute;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #ff6482;
}

.gate-heart::before { top: -15px; left: 0; }
.gate-heart::after { top: 0; right: -15px; }

@keyframes pulse {
  0%, 100% { transform: rotate(-45deg) scale(1); }
  50% { transform: rotate(-45deg) scale(1.15); }
}

.gate-title {
  font-size: 22px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.9);
}

.bar {
  width: 180px;
  height: 2px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 2px;
  overflow: hidden;
}

.bar span {
  display: block;
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff3d5c, #ffb0c0);
  transition: width 200ms linear;
}

.gate-status {
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.5);
}

#gate-prompt {
  font-size: 12px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.85);
  animation: breathe 2.2s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 1; }
}

/* ---------- Scene UI ---------- */
#ui {
  opacity: 0;
  transition: opacity 1200ms ease;
}

#ui.visible {
  opacity: 1;
}

.info {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255, 255, 255, 0.6);
  font-size: 14px;
  text-align: center;
  pointer-events: none;
  z-index: 10;
}

.info p {
  margin: 5px 0;
}

#mute-btn {
  position: fixed;
  left: 18px;
  bottom: 18px;
  z-index: 20;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.25);
  background: rgba(26, 4, 8, 0.55);
  color: rgba(255, 255, 255, 0.85);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 0;
}

#mute-btn svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

#mute-btn:focus-visible {
  outline: 2px solid #ff6482;
  outline-offset: 2px;
}

@media (max-width: 768px) {
  .info { font-size: 12px; }
  .gate-title { font-size: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  .gate-heart, #gate-prompt { animation: none; }
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="ui">
  <div class="info">
    <p>✨ Geser untuk memutar | Cubit untuk memperbesar ✨</p>
  </div>
  <button id="mute-btn" type="button" aria-label="Matikan musik">
    <svg id="icon-on" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9v6h4l5 5V4L8 9H4zm12.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 2.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.5 7-8.8s-3-7.8-7-8.8z"/>
    </svg>
    <svg id="icon-off" class="hidden" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9v6h4l5 5V4L8 9H4zm16.5 0L19 7.5 16.5 10 14 7.5 12.5 9l2.5 2.5-2.5 2.5 1.5 1.5 2.5-2.5 2.5 2.5 1.5-1.5-2.5-2.5L20.5 9z"/>
    </svg>
  </button>
</div>

<div id="gate">
  <div class="gate-heart"></div>
  <div class="gate-title" id="gate-title">For my Zia</div>
  <div class="bar"><span id="bar-fill"></span></div>
  <div class="gate-status" id="gate-status">Memuat 0%</div>
  <div id="gate-prompt" class="hidden">Ketuk di mana saja untuk membuka</div>
</div>

<audio id="bg-music" loop preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   CONFIG — edit per order
   ========================================================= */
var LOVAMOMENT_ASSET_BASE = '__LOVAMOMENT_ASSET_BASE__';
if (LOVAMOMENT_ASSET_BASE.indexOf('LOVAMOMENT_ASSET_BASE') !== -1) {
  LOVAMOMENT_ASSET_BASE = '';
}
var CONFIG = {
  ASSET_BASE: LOVAMOMENT_ASSET_BASE,
  FLOATING_TEXT: "i love you",
  CENTER_TEXT: "Love you",
  GATE_TITLE: "For my Zia",
  GATE_PROMPT: "Ketuk di mana saja untuk membuka",
  MUSIC_FILE: "music.mp3",
  MUSIC_VOLUME: 0.6,
  CAMERA_START_Z: 80,
  ZOOM_MIN: 26,
  ZOOM_MAX: 170,
  TEXT_MAX_WIDTH: 62
};

document.getElementById("gate-title").textContent = CONFIG.GATE_TITLE;
document.getElementById("gate-prompt").textContent = CONFIG.GATE_PROMPT;

/* =========================================================
   Scene setup
   ========================================================= */
var canvas = document.getElementById("canvas");
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

camera.position.z = CONFIG.CAMERA_START_Z;

/* ---------- Lighting ---------- */
var ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

var pointLight1 = new THREE.PointLight(0xff6482, 1.5, 300);
pointLight1.position.set(50, 50, 50);
scene.add(pointLight1);

var pointLight2 = new THREE.PointLight(0xff3d5c, 1.2, 300);
pointLight2.position.set(-50, -50, 50);
scene.add(pointLight2);

/* ---------- Color palette ---------- */
var colors = [
  0xff6482, 0xff7a92, 0xff8a9b, 0xff9aaa, 0xffb0c0,
  0xffccc8, 0xff4d6d, 0xff3d5c, 0xee4a5f, 0xdd3a4d, 0xcc2a3b
];

/* ---------- Floating text sprites ---------- */
function createTextMesh(text, x, y, z, size) {
  var c = document.createElement("canvas");
  var ctx = c.getContext("2d");
  c.width = 256;
  c.height = 64;

  ctx.fillStyle = "white";
  ctx.font = "bold 48px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 128, 32);

  var texture = new THREE.CanvasTexture(c);
  var material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    depthWrite: false,
    alphaTest: 0.05
  });

  var geometry = new THREE.PlaneGeometry(20 * size, 5 * size);
  var mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  return mesh;
}

var textGroup = new THREE.Group();
scene.add(textGroup);

function generateHeartCloud() {
  var cloudPoints = [];

  for (var i = 0; i < 300; i++) {
    var angle = Math.random() * Math.PI * 2;
    var radius = Math.random() * 50;
    var x = Math.cos(angle) * radius;
    var y = Math.sin(angle) * radius + Math.random() * 40 - 20;
    var z = (Math.random() - 0.5) * 60;

    if (Math.sqrt(x * x + y * y) < 60) {
      cloudPoints.push({ x: x, y: y, z: z });
    }
  }

  cloudPoints.forEach(function (point) {
    var textMesh = createTextMesh(
      CONFIG.FLOATING_TEXT,
      point.x,
      point.y,
      point.z,
      0.4 + Math.random() * 0.4
    );

    textMesh.material.color.setHex(colors[Math.floor(Math.random() * colors.length)]);
    textMesh.material.opacity = 0.4 + Math.random() * 0.6;
    textMesh.rotation.z = Math.random() * Math.PI * 2;
    textMesh.lookAt(camera.position);

    textMesh.userData.originalPos = { x: point.x, y: point.y, z: point.z };
    textMesh.userData.time = Math.random() * Math.PI * 2;
    textMesh.userData.speed = 0.01 + Math.random() * 0.02;
    textMesh.userData.amplitudeX = 2 + Math.random() * 3;
    textMesh.userData.amplitudeY = 2 + Math.random() * 3;
    textMesh.userData.amplitudeZ = 2 + Math.random() * 3;

    textGroup.add(textMesh);
  });
}

generateHeartCloud();

/* =========================================================
   Center text — now part of the 3D scene, so sprites floating
   in front of it pass over the top of it
   ========================================================= */
var TEXT_FONT = "bold 150px Arial";
var TEXT_PAD = 90;

var textCanvas = document.createElement("canvas");
textCanvas.width = 1024;
textCanvas.height = 320;
var textTexture = new THREE.CanvasTexture(textCanvas);
var textAspect = 4;

function drawCenterText() {
  var g = textCanvas.getContext("2d");

  // measure first, then fit the canvas to the text so the plane
  // never has to stretch to cover empty space
  g.font = TEXT_FONT;
  var measured = g.measureText(CONFIG.CENTER_TEXT).width;
  textCanvas.width = Math.max(256, Math.ceil(measured + TEXT_PAD * 2));
  textCanvas.height = 320;
  textAspect = textCanvas.width / textCanvas.height;

  g.clearRect(0, 0, textCanvas.width, textCanvas.height);
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.font = TEXT_FONT;
  g.shadowColor = "rgba(255, 100, 130, 0.9)";
  g.shadowBlur = 45;
  g.fillStyle = "#ffffff";
  g.fillText(CONFIG.CENTER_TEXT, textCanvas.width / 2, textCanvas.height / 2);
  g.shadowBlur = 0;
  g.fillText(CONFIG.CENTER_TEXT, textCanvas.width / 2, textCanvas.height / 2);

  textTexture.needsUpdate = true;
}

drawCenterText();

var centerText = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({
    map: textTexture,
    transparent: true,
    depthTest: true,
    depthWrite: false,
    opacity: 0.9
  })
);
scene.add(centerText);

function sizeCenterText() {
  var visibleHeight = 2 * Math.tan((75 * Math.PI / 180) / 2) * CONFIG.CAMERA_START_Z;
  var visibleWidth = visibleHeight * (window.innerWidth / window.innerHeight);
  var width = Math.min(CONFIG.TEXT_MAX_WIDTH, visibleWidth * 0.8);
  // height derived from the canvas aspect — keeps the letters unstretched
  centerText.scale.set(width, width / textAspect, 1);
}

sizeCenterText();

/* =========================================================
   Interaction — rotate, pinch zoom, wheel zoom
   ========================================================= */
var targetRotationX = 0;
var targetRotationY = 0;
var currentRotationX = 0;
var currentRotationY = 0;
var targetZoom = CONFIG.CAMERA_START_Z;

var isDragging = false;
var lastX = 0;
var lastY = 0;
var pinchStartDist = 0;
var pinchStartZoom = 0;

function clampZoom(v) {
  return Math.max(CONFIG.ZOOM_MIN, Math.min(CONFIG.ZOOM_MAX, v));
}

function touchDistance(touches) {
  var dx = touches[0].clientX - touches[1].clientX;
  var dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy) || 1;
}

canvas.addEventListener("mousedown", function (e) {
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener("mouseup", function () {
  isDragging = false;
});

window.addEventListener("mousemove", function (e) {
  if (!isDragging) { return; }
  targetRotationY += (e.clientX - lastX) * 0.005;
  targetRotationX += (e.clientY - lastY) * 0.005;
  lastX = e.clientX;
  lastY = e.clientY;
  markActive();
});

canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  targetZoom = clampZoom(targetZoom + e.deltaY * 0.08);
  markActive();
}, { passive: false });

canvas.addEventListener("touchstart", function (e) {
  if (e.touches.length === 1) {
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    pinchStartDist = touchDistance(e.touches);
    pinchStartZoom = targetZoom;
  }
}, { passive: true });

canvas.addEventListener("touchmove", function (e) {
  if (e.touches.length === 1) {
    targetRotationY += (e.touches[0].clientX - lastX) * 0.006;
    targetRotationX += (e.touches[0].clientY - lastY) * 0.006;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    var d = touchDistance(e.touches);
    if (pinchStartDist > 0) {
      targetZoom = clampZoom(pinchStartZoom * (pinchStartDist / d));
    }
  }
  markActive();
  e.preventDefault();
}, { passive: false });

/* ---------- Idle auto-rotate ---------- */
var isIdle = true;
var idleTimer = null;

function markActive() {
  isIdle = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function () { isIdle = true; }, 3000);
}

/* =========================================================
   Render loop
   ========================================================= */
function animate() {
  requestAnimationFrame(animate);

  if (isIdle) {
    targetRotationY += 0.002;
    targetRotationX += 0.0005;
  }

  currentRotationX += (targetRotationX - currentRotationX) * 0.05;
  currentRotationY += (targetRotationY - currentRotationY) * 0.05;

  textGroup.rotation.x = currentRotationX;
  textGroup.rotation.y = currentRotationY;

  camera.position.z += (targetZoom - camera.position.z) * 0.08;

  var children = textGroup.children;
  for (var i = 0; i < children.length; i++) {
    var mesh = children[i];
    var d = mesh.userData;
    d.time += d.speed;
    mesh.position.x = d.originalPos.x + Math.sin(d.time) * d.amplitudeX;
    mesh.position.y = d.originalPos.y + Math.cos(d.time * 0.7) * d.amplitudeY;
    mesh.position.z = d.originalPos.z + Math.sin(d.time * 0.5) * d.amplitudeZ;
    mesh.lookAt(camera.position);
  }

  pointLight1.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.001);
  pointLight2.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), -0.001);

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  sizeCenterText();
});

/* =========================================================
   Music + mute
   ========================================================= */
var music = document.getElementById("bg-music");
music.src = CONFIG.ASSET_BASE + CONFIG.MUSIC_FILE;
music.volume = CONFIG.MUSIC_VOLUME;

var muteBtn = document.getElementById("mute-btn");
var iconOn = document.getElementById("icon-on");
var iconOff = document.getElementById("icon-off");
var isMuted = false;

muteBtn.addEventListener("click", function (e) {
  e.stopPropagation();
  isMuted = !isMuted;
  music.muted = isMuted;
  iconOn.classList.toggle("hidden", isMuted);
  iconOff.classList.toggle("hidden", !isMuted);
  muteBtn.setAttribute("aria-label", isMuted ? "Nyalakan musik" : "Matikan musik");
});

/* =========================================================
   Loading screen + gate
   ========================================================= */
var gate = document.getElementById("gate");
var barFill = document.getElementById("bar-fill");
var gateStatus = document.getElementById("gate-status");
var gatePrompt = document.getElementById("gate-prompt");
var ui = document.getElementById("ui");

var progress = 0;
var sceneReady = false;
var gateOpen = false;

requestAnimationFrame(function () {
  requestAnimationFrame(function () { sceneReady = true; });
});

var loadTick = setInterval(function () {
  var ceiling = sceneReady ? 100 : 92;
  progress = Math.min(ceiling, progress + 2 + Math.random() * 5);
  barFill.style.width = progress + "%";
  gateStatus.textContent = "Memuat " + Math.floor(progress) + "%";

  if (progress >= 100) {
    clearInterval(loadTick);
    gateStatus.classList.add("hidden");
    gatePrompt.classList.remove("hidden");
    gate.addEventListener("click", openGate);
    gate.addEventListener("touchend", openGate);
  }
}, 130);

function openGate(e) {
  if (gateOpen) { return; }
  gateOpen = true;
  if (e) { e.preventDefault(); }

  // must start inside the tap handler for mobile autoplay
  var p = music.play();
  if (p && p.catch) { p.catch(function () {}); }

  gate.classList.add("fade-out");
  ui.classList.add("visible");
  markActive();

  setTimeout(function () {
    gate.classList.add("hidden");
  }, 950);
}
</script>
</body>
</html>
