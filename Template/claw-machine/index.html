<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Claw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bungee&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Petit+Formal+Script&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THE CLAW - Lovamoment Template
   Single file. No template literals. Two-page .hidden toggle.
   ============================================================ */

:root{
  /* ---- CABINET ---- */
  --cab-1:#ff6b7d;
  --cab-2:#e0233f;
  --cab-3:#a5122b;
  --cream:#fff3dc;
  --teal:#17c4c4;
  --sun:#ffce3d;
  --gold:#d9a441;

  /* ---- PLAYFIELD ---- */
  --grape-1:#5b25a8;
  --grape-2:#2b1055;
  --grape-3:#150627;

  /* ---- NEON ---- */
  --neon:#ff3ea5;
  --cyan:#57e8ff;

  /* ---- CHROME ---- */
  --chr-hi:#f4f7ff;
  --chr-mid:#b9c0d8;
  --chr-lo:#5d6484;

  /* ---- TYPE ---- */
  --f-pixel:'Press Start 2P', monospace;
  --f-display:'Bungee', sans-serif;
  --f-body:'Cormorant Garamond', Georgia, serif;
  --f-script:'Petit Formal Script', cursive;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:
    radial-gradient(circle at 50% 0%, #3a1470 0%, var(--grape-3) 65%, #0a0214 100%);
  color:var(--cream);
  font-family:var(--f-body);
  overflow-x:hidden;
  min-height:100%;
}
.hidden{display:none !important;}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}

/* ================= GATE ================= */
#page-gate{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;text-align:center;padding:24px;
  background:radial-gradient(circle at 50% 45%, #3d1478 0%, #180733 60%, #08010f 100%);
}
#page-gate::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 4px);
  opacity:.5;
}
.gate-title{
  font-family:var(--f-pixel);font-size:clamp(22px,8vw,38px);line-height:1.5;
  color:var(--cream);
  text-shadow:0 0 10px var(--neon),0 0 26px rgba(255,62,165,.7),4px 4px 0 var(--cab-3);
  animation:gateFlicker 4s infinite;
}
.gate-sub{font-family:var(--f-display);font-size:13px;letter-spacing:3px;color:var(--sun);}
.gate-coin{
  width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fff2b0, var(--sun) 45%, #b8801a 100%);
  border:3px solid #8a5c10;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-pixel);font-size:9px;color:#7a4f0c;
  box-shadow:0 0 26px rgba(255,206,61,.6);
  animation:coinSpin 2.6s ease-in-out infinite;
}
.gate-tap{
  font-family:var(--f-pixel);font-size:10px;color:var(--cyan);
  animation:blink 1.1s steps(1) infinite;
}
@keyframes gateFlicker{0%,96%,100%{opacity:1}97%{opacity:.55}98%{opacity:1}99%{opacity:.7}}
@keyframes coinSpin{0%,100%{transform:rotateY(0deg) translateY(0)}50%{transform:rotateY(180deg) translateY(-10px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}

/* ================= MACHINE PAGE ================= */
#page-machine{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:18px 12px 30px;gap:14px;
}
.cabinet{
  width:min(94vw,392px);position:relative;
  filter:drop-shadow(0 26px 40px rgba(0,0,0,.6));
}

/* ---- MARQUEE ---- */
.marquee{
  position:relative;border-radius:20px 20px 6px 6px;padding:14px 12px 12px;
  background:linear-gradient(180deg,var(--cab-1) 0%,var(--cab-2) 55%,var(--cab-3) 100%);
  border:3px solid #7d0c1f;border-bottom:none;
  text-align:center;
}
.bulbs{display:flex;justify-content:space-between;padding:0 6px 9px;}
.bulb{
  width:7px;height:7px;border-radius:50%;background:var(--sun);
  box-shadow:0 0 7px var(--sun);animation:bulbRun 1.2s infinite;
}
@keyframes bulbRun{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.marq-title{
  font-family:var(--f-pixel);font-size:clamp(15px,5.2vw,22px);color:var(--cream);
  letter-spacing:1px;line-height:1.4;
  text-shadow:0 0 8px var(--neon),0 0 20px rgba(255,62,165,.65),3px 3px 0 #6d0a1a;
}
.marq-sub{
  font-family:var(--f-display);font-size:9px;letter-spacing:3.5px;
  color:var(--sun);margin-top:7px;
}

/* ---- GLASS BOX ---- */
.glassbox{
  position:relative;
  border-left:12px solid;border-right:12px solid;
  border-image:linear-gradient(180deg,var(--cab-1),var(--cab-3)) 1;
  background:#0d0320;
  padding:8px;
}
.frame{
  position:relative;overflow:hidden;border-radius:6px;
  border:3px solid #12042a;
  box-shadow:inset 0 0 0 2px rgba(87,232,255,.18);
}
.playfield{
  position:relative;width:100%;aspect-ratio:1 / 1.12;
  background:
    radial-gradient(circle at 50% 18%, var(--grape-1) 0%, var(--grape-2) 55%, var(--grape-3) 100%);
  overflow:hidden;
}
.stars{
  position:absolute;inset:0;pointer-events:none;opacity:.85;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 14%, #fff 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 78% 9%, var(--cyan) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 34% 27%, #fff 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 62% 33%, var(--sun) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 88% 24%, #fff 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 22% 40%, var(--neon) 50%, transparent 51%);
  animation:twinkle 3.4s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.35}to{opacity:.95}}

/* rail */
.rail{
  position:absolute;top:16px;left:0;right:0;height:7px;z-index:4;
  background:linear-gradient(180deg,var(--chr-hi),var(--chr-mid) 45%,var(--chr-lo));
  box-shadow:0 2px 5px rgba(0,0,0,.5);
}
.rail-end{position:absolute;top:10px;width:10px;height:19px;border-radius:3px;
  background:linear-gradient(180deg,var(--chr-mid),var(--chr-lo));z-index:5;}
.rail-end.left{left:0}
.rail-end.right{right:0}

/* trolley + claw */
.trolley{
  position:absolute;top:14px;left:50%;z-index:6;
  transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;
}
.trolley.smooth{transition:left 1.15s cubic-bezier(.42,0,.35,1);}
.trolley-head{
  width:52px;height:19px;border-radius:5px;
  background:linear-gradient(180deg,var(--chr-hi) 0%,var(--chr-mid) 42%,var(--chr-lo) 100%);
  border:1px solid #3d4260;position:relative;
}
.trolley-head::after{
  content:'';position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);
  width:16px;height:5px;border-radius:2px;background:var(--chr-lo);
}
.cable{
  width:5px;height:14px;
  background:linear-gradient(90deg,#41465f,var(--chr-hi) 45%,#41465f);
  transition:height .95s cubic-bezier(.45,.05,.55,.95);
}
.claw-wrap{position:relative;width:88px;height:74px;margin-top:-1px;}
.claw-svg{width:100%;height:100%;display:block;overflow:visible;}
.prong{transition:transform .38s cubic-bezier(.3,1.4,.5,1);transform-origin:50px 15px;}
.claw-wrap.open .prong-l{transform:rotate(-26deg);}
.claw-wrap.open .prong-r{transform:rotate(26deg);}
.claw-wrap.open .prong-m{transform:scaleY(.92);}

/* held item slot */
.held{
  position:absolute;left:50%;top:40px;transform:translateX(-50%);
  z-index:-1;
}

/* pile */
.pile{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:2;}
.floor{
  position:absolute;left:0;right:0;bottom:0;height:26%;
  background:
    repeating-linear-gradient(90deg,#3a1568 0 14px,#4d1f86 14px 28px);
  border-top:2px solid rgba(87,232,255,.25);
}
.item{
  position:absolute;bottom:0;font-size:23px;line-height:1;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.45));
  transform-origin:bottom center;
  animation:jiggle 3.6s ease-in-out infinite;
}
@keyframes jiggle{0%,100%{transform:rotate(var(--rot)) translateY(0)}50%{transform:rotate(calc(var(--rot) + 3deg)) translateY(-2px)}}
.ball{
  position:absolute;bottom:0;border-radius:50%;
  box-shadow:inset -4px -5px 8px rgba(0,0,0,.35), inset 4px 4px 7px rgba(255,255,255,.55), 0 3px 4px rgba(0,0,0,.4);
}

/* prize capsule */
.prize{
  position:absolute;width:52px;height:52px;z-index:3;
  transition:left .6s ease, bottom .35s ease;
  display:flex;align-items:center;justify-content:center;
}
.capsule{
  width:52px;height:52px;border-radius:50%;position:relative;
  background:linear-gradient(180deg, rgba(255,255,255,.55) 0 50%, var(--sun) 50% 100%);
  border:2px solid rgba(255,255,255,.75);
  box-shadow:0 0 16px rgba(255,206,61,.9),0 0 32px rgba(255,62,165,.55),inset -5px -6px 10px rgba(0,0,0,.2);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  animation:bob 2.4s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.prize.dropping .capsule{animation:none;}
.prize.dropping{animation:fallIn .8s cubic-bezier(.5,0,.9,.9) forwards;}
@keyframes fallIn{
  0%{transform:translateY(0) rotate(0);opacity:1}
  70%{transform:translateY(74px) rotate(38deg);opacity:1}
  100%{transform:translateY(96px) rotate(60deg);opacity:0}
}
.prize.slipping{animation:slip .7s ease-in forwards;}
@keyframes slip{
  0%{transform:translate(0,0) rotate(0)}
  30%{transform:translate(-5px,0) rotate(-10deg)}
  55%{transform:translate(5px,0) rotate(10deg)}
  100%{transform:translate(0,120px) rotate(45deg)}
}

/* chute */
.chute{
  position:absolute;left:5%;bottom:0;width:23%;height:22%;z-index:3;
  background:linear-gradient(180deg,#050110,#1a0733);
  border:2px solid var(--chr-lo);border-bottom:none;border-radius:5px 5px 0 0;
  box-shadow:inset 0 8px 14px rgba(0,0,0,.9);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;
}
.chute span{font-family:var(--f-pixel);font-size:6px;color:var(--cyan);opacity:.8;}
.chute.lit{border-color:var(--cyan);box-shadow:inset 0 8px 14px rgba(0,0,0,.9),0 0 18px var(--cyan);}

/* glass glare */
.glare{
  position:absolute;inset:0;z-index:8;pointer-events:none;
  background:linear-gradient(118deg, rgba(255,255,255,.16) 0 16%, transparent 16% 34%, rgba(255,255,255,.09) 34% 41%, transparent 41%);
}
.scan{
  position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.28;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.5) 0 2px, transparent 2px 4px);
}

/* ---- LED READOUT ---- */
.readout{
  margin:0 12px;background:#0b0318;border:3px solid #4a1f18;border-top:none;
  padding:9px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.led-msg{
  font-family:var(--f-pixel);font-size:8px;color:var(--sun);
  text-shadow:0 0 8px rgba(255,206,61,.85);line-height:1.6;flex:1;
}
.credit{font-family:var(--f-pixel);font-size:8px;color:var(--cyan);text-shadow:0 0 8px var(--cyan);white-space:nowrap;}

/* ---- CONTROL PANEL ---- */
.panel{
  background:linear-gradient(180deg,var(--cab-1),var(--cab-2) 60%,var(--cab-3));
  border:3px solid #7d0c1f;border-top:none;
  border-radius:0 0 16px 16px;
  padding:14px 14px 18px;
}
.panel-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.slot{
  position:relative;width:64px;height:46px;border-radius:6px;flex:0 0 auto;
  background:linear-gradient(180deg,var(--chr-mid),var(--chr-lo));
  border:2px solid #3a3f5c;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.slot::after{
  content:'';width:6px;height:26px;border-radius:3px;background:#0a0a14;
  box-shadow:inset 0 0 6px #000;
}
.slot-label{
  position:absolute;bottom:2px;font-family:var(--f-pixel);font-size:5px;color:#2a2e44;
}
.coin-anim{
  position:absolute;top:-30px;left:50%;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fff2b0, var(--sun) 45%, #b8801a 100%);
  transform:translateX(-50%);opacity:0;z-index:3;
}
.coin-anim.go{animation:coinDrop .55s ease-in forwards;}
@keyframes coinDrop{0%{opacity:1;top:-30px}100%{opacity:0;top:20px}}
.btn-row{display:flex;gap:10px;flex:1;}

.abtn{
  flex:1;position:relative;border-radius:12px;padding:11px 6px;
  font-family:var(--f-pixel);font-size:8px;line-height:1.5;letter-spacing:.5px;
  color:#2b0f14;text-align:center;
  border:2px solid rgba(0,0,0,.35);
  box-shadow:0 5px 0 rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.6);
  transition:transform .07s, box-shadow .07s, filter .2s;
}
.abtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.5);}
.abtn:disabled{filter:grayscale(.75) brightness(.72);cursor:not-allowed;}
.abtn:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;}
.b-coin{background:linear-gradient(180deg,#ffe27a,var(--sun));}
.b-move{background:linear-gradient(180deg,#7ef0f0,var(--teal));}
.b-grab{background:linear-gradient(180deg,#ff8fb8,var(--neon));color:#3d0620;}
.abtn.pulse{animation:btnPulse 1s ease-in-out infinite;}
@keyframes btnPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}

/* ---- BASE / PRIZE DOOR ---- */
.base{
  width:min(94vw,392px);margin-top:-2px;
  background:linear-gradient(180deg,#8f1024,#5a0916);
  border:3px solid #4a0712;border-top:none;border-radius:0 0 14px 14px;
  padding:14px;display:flex;align-items:center;justify-content:center;
}
.door{
  width:100%;max-width:230px;border-radius:10px;padding:14px 10px;
  background:linear-gradient(180deg,#170528,#090114);
  border:2px solid #3b2456;text-align:center;
  font-family:var(--f-pixel);font-size:7px;color:#6b5c8a;letter-spacing:1px;
  transition:all .4s;
}
.door.lit{
  border-color:var(--sun);color:#1a0a02;
  background:linear-gradient(180deg,#ffe27a,var(--sun));
  box-shadow:0 0 22px rgba(255,206,61,.85);
  animation:btnPulse 1s ease-in-out infinite;
}
.door.lit .door-cta{display:block;}
.door-cta{display:none;font-size:9px;margin-top:8px;color:#3d1a02;}

/* sfx toggle */
.sfx-toggle{
  position:fixed;top:12px;right:12px;z-index:40;
  width:38px;height:38px;border-radius:50%;
  background:rgba(20,5,40,.75);border:2px solid rgba(87,232,255,.4);
  font-size:15px;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}

/* particles */
.pt{position:fixed;z-index:80;pointer-events:none;font-size:18px;will-change:transform;}

/* shake */
.shake{animation:shake .28s ease;}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}}

/* ================= LETTER PAGE ================= */
#page-letter{
  min-height:100vh;padding:34px 16px 56px;
  display:flex;flex-direction:column;align-items:center;
  background:
    radial-gradient(circle at 50% 0%, #46187f 0%, #1d0a3a 55%, #08010f 100%);
}
.winner-badge{
  font-family:var(--f-pixel);font-size:9px;color:var(--sun);
  text-shadow:0 0 10px rgba(255,206,61,.9);letter-spacing:2px;margin-bottom:16px;
  animation:blink 1.6s steps(1) infinite;
}
.ticket{
  width:100%;max-width:430px;position:relative;
  background:
    linear-gradient(180deg,#fffaf0 0%, var(--cream) 55%, #f6e5c6 100%);
  color:#3b2412;
  padding:34px 24px 30px;
  box-shadow:0 22px 50px rgba(0,0,0,.6);
  border-radius:4px;
}
/* perforated ticket edges */
.ticket::before,.ticket::after{
  content:'';position:absolute;left:0;right:0;height:14px;
  background-image:radial-gradient(circle at 7px 7px, transparent 6.5px, var(--cream) 7px);
  background-size:14px 14px;
}
.ticket::before{top:-7px;transform:rotate(180deg);}
.ticket::after{bottom:-7px;}
.ticket-head{text-align:center;border-bottom:2px dashed #cbb083;padding-bottom:16px;margin-bottom:20px;}
.ticket-kicker{font-family:var(--f-pixel);font-size:7px;letter-spacing:2px;color:#a8763a;}
.ticket-title{
  font-family:var(--f-display);font-size:clamp(21px,6.6vw,29px);
  color:#b02644;margin-top:11px;line-height:1.15;letter-spacing:.5px;
}
.serial{font-family:var(--f-pixel);font-size:6px;color:#b09a72;margin-top:11px;letter-spacing:1px;}

.photo-wrap{margin:0 auto 24px;max-width:250px;position:relative;transform:rotate(-2deg);}
.polaroid{
  background:#fff;padding:12px 12px 44px;
  box-shadow:0 12px 26px rgba(0,0,0,.35);
}
.polaroid img{width:100%;display:block;background:#e8e0d0;}
.photo-cap{
  position:absolute;bottom:14px;left:0;right:0;text-align:center;
  font-family:var(--f-script);font-size:16px;color:#6a4a2e;
}
.tape{
  position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-3deg);
  width:78px;height:22px;background:rgba(255,206,61,.55);
  box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.letter-body p{
  font-family:var(--f-body);font-size:17.5px;line-height:1.85;
  margin-bottom:17px;color:#40291a;
}
.letter-body p.lead{font-size:19px;font-style:italic;color:#7a3242;}
.divider{
  display:flex;align-items:center;justify-content:center;gap:9px;
  margin:24px 0;color:#c9a05a;font-size:12px;
}
.divider::before,.divider::after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,#d3b47f,transparent);}
.sign-off{margin-top:26px;text-align:right;}
.sign-off .from{font-family:var(--f-body);font-size:16px;color:#6a4a2e;font-style:italic;}
.sign-off .name{font-family:var(--f-script);font-size:34px;color:#b02644;line-height:1.2;margin-top:4px;}

.stub{
  width:100%;max-width:430px;margin-top:28px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
}
.replay{
  font-family:var(--f-pixel);font-size:9px;line-height:1.6;
  padding:15px 24px;border-radius:12px;color:#2b0f14;
  background:linear-gradient(180deg,#ffe27a,var(--sun));
  border:2px solid rgba(0,0,0,.3);
  box-shadow:0 5px 0 rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.6);
}
.replay:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45);}
.replay:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;}
.foot{font-family:var(--f-pixel);font-size:6px;color:#7c6aa0;letter-spacing:1.5px;}

/* reveal */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s ease;}
.reveal.in{opacity:1;transform:none;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.15s !important;}
}
@media (max-width:340px){
  .abtn{font-size:7px;padding:10px 4px;}
  .led-msg{font-size:7px;}
}
</style>
</head>
<body>

<!-- ============ GATE ============ -->
<div id="page-gate">
  <div class="gate-title" id="gateTitle">THE CLAW</div>
  <div class="gate-sub" id="gateSub">ARCADE OF ONE PRIZE</div>
  <div class="gate-coin">1 PLAY</div>
  <div class="gate-tap">TAP TO START</div>
</div>

<!-- ============ MACHINE ============ -->
<div id="page-machine" class="hidden">

  <button class="sfx-toggle" id="sfxBtn" aria-label="Sound on or off">&#128266;</button>

  <div class="cabinet" id="cabinet">
    <!-- marquee -->
    <div class="marquee">
      <div class="bulbs" id="bulbs"></div>
      <div class="marq-title" id="marqTitle">THE CLAW</div>
      <div class="marq-sub" id="marqSub">ONE PRIZE - ONE PERSON</div>
    </div>

    <!-- glass -->
    <div class="glassbox">
      <div class="frame">
        <div class="playfield" id="playfield">

<script>
/* ============================================================
   CONFIG - edit per order
   ============================================================ */
var LOVAMOMENT_ASSET_BASE = '__LOVAMOMENT_ASSET_BASE__';
if (LOVAMOMENT_ASSET_BASE.indexOf('LOVAMOMENT_ASSET_BASE') !== -1) {
  LOVAMOMENT_ASSET_BASE = '';
}
var CONFIG = {
  ASSET_BASE: LOVAMOMENT_ASSET_BASE,
  /* --- names --- */
  recipientName: 'Zia',
  senderName: 'Leo',

  /* --- machine copy --- */
  gateTitle: 'THE CLAW',
  gateSub: 'ARCADE OF ONE PRIZE',
  marqueeTitle: 'THE CLAW',
  marqueeSub: 'ONE PRIZE - ONE PERSON',

  /* --- letter --- */
  ticketKicker: 'PRIZE VOUCHER - NO EXPIRY',
  letterTitle: 'Hadiah Utama Hidupku',
  /* Tanggal diisi otomatis dari waktu lokal pembuka halaman, format DD-MM-YYYY. */
  serialPrefix: 'SERIAL',
  serialSuffix: 'GRAND PRIZE 001',
  letterParagraphs: [

    'You are the kind of woman people write songs about, dan aku beruntung bisa jadi orang yang menulisnya setiap hari, walaupun cuma lewat hal-hal kecil.',

  /* --- gameplay --- */
  clawSpeed: 0.62,        /* percent of playfield width per frame */
  minX: 12,               /* left limit (%) */
  maxX: 88,               /* right limit (%) */
  prizeX: 63,             /* prize position (%) */
  chuteX: 16,             /* drop position (%) */

  /* --- pile contents --- */
  pileEmoji: ['\uD83E\uDDF8','\uD83C\uDF88','\uD83C\uDF6D','\uD83C\uDF08','\u2B50','\uD83C\uDF80','\uD83C\uDF6C','\uD83D\uDC3B','\uD83E\uDD84','\uD83C\uDF81','\uD83E\uDDC1','\uD83C\uDF38','\uD83D\uDC23','\uD83C\uDFA0','\uD83C\uDF6B','\uD83D\uDC2C','\uD83C\uDF52','\uD83C\uDF00'],
  ballColors: ['#ff6b7d','#57e8ff','#ffce3d','#17c4c4','#ff3ea5','#a06bff','#7dff9e','#ff9f4d']
};

/* ============================================================
   SHORTHANDS
   ============================================================ */
function $(id){ return document.getElementById(id); }

var pageGate = $('page-gate');
var pageMachine = $('page-machine');
var pageLetter = $('page-letter');
var playfield = $('playfield');
var trolley = $('trolley');
var cable = $('cable');
var clawWrap = $('clawWrap');
var held = $('held');
var prize = $('prize');
var pile = $('pile');
var chute = $('chute');
var door = $('door');
var doorCta = $('doorCta');
var ledMsg = $('ledMsg');
var credit = $('credit');
var cabinet = $('cabinet');
var btnCoin = $('btnCoin');
var btnMove = $('btnMove');
var btnGrab = $('btnGrab');
var bgm = $('bgm');

var CABLE_REST = 14;

var state = {
  credit: 0,
  x: 50,
  dir: 1,
  moving: false,
  busy: false,
  won: false,
  tries: 0,
  started: false
};

/* ============================================================
   AUDIO - WebAudio generated SFX
   ============================================================ */
var actx = null;
var master = null;
var sfxOn = CONFIG.soundEnabled;
var motor = null;

function initAudio(){
  if(!actx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ return; }
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.8;
    master.connect(actx.destination);
  }
  if(actx.state === 'suspended'){ actx.resume(); }
}

function tone(freq, dur, type, vol, delay, slideTo){
  if(!actx || !sfxOn){ return; }
  var t0 = actx.currentTime + (delay || 0);
  var osc = actx.createOscillator();
  var g = actx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  if(slideTo){ osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur); }
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(master);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}

function noise(dur, vol, cutoff, delay){
  if(!actx || !sfxOn){ return; }
  var t0 = actx.currentTime + (delay || 0);
  var len = Math.floor(actx.sampleRate * dur);
  var buf = actx.createBuffer(1, len, actx.sampleRate);
  var d = buf.getChannelData(0);
  for(var i = 0; i < len; i++){ d[i] = (Math.random() * 2 - 1) * (1 - i / len); }
  var src = actx.createBufferSource();
  src.buffer = buf;
  var f = actx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = cutoff || 1800;
  var g = actx.createGain();
  g.gain.value = vol || 0.14;
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0);
}

function sfxCoin(){
  tone(988, 0.09, 'square', 0.18, 0);
  tone(1319, 0.14, 'square', 0.18, 0.09);
  noise(0.18, 0.08, 2600, 0);
}
function sfxBeep(){ tone(660, 0.07, 'square', 0.13, 0); }
function sfxServo(){ tone(180, 0.5, 'sawtooth', 0.07, 0, 90); }
function sfxClank(){
  noise(0.16, 0.16, 2200, 0);
  tone(420, 0.13, 'square', 0.11, 0.02);
  tone(300, 0.2, 'triangle', 0.09, 0.06);
}
function sfxThud(){
  tone(120, 0.3, 'sine', 0.22, 0, 55);
  noise(0.22, 0.1, 500, 0);
}
function sfxFail(){
  tone(392, 0.14, 'square', 0.14, 0);
  tone(294, 0.16, 'square', 0.14, 0.13);
  tone(196, 0.3, 'square', 0.13, 0.28);
}
function sfxWin(){
  var n = [523, 659, 784, 1047, 1319];
  for(var i = 0; i < n.length; i++){
    tone(n[i], 0.16, 'square', 0.15, i * 0.11);
    tone(n[i] / 2, 0.16, 'triangle', 0.09, i * 0.11);
  }
  tone(1568, 0.55, 'square', 0.14, 0.6);
}
function motorStart(){
  if(!actx || !sfxOn || motor){ return; }
  var osc = actx.createOscillator();
  var g = actx.createGain();
  var f = actx.createBiquadFilter();
  osc.type = 'sawtooth';
  osc.frequency.value = 68;
  f.type = 'lowpass';
  f.frequency.value = 420;
  g.gain.value = 0.0001;
  g.gain.exponentialRampToValueAtTime(0.05, actx.currentTime + 0.08);
  osc.connect(f); f.connect(g); g.connect(master);
  osc.start();
  motor = { osc: osc, gain: g };
}
function motorStop(){
  if(!motor){ return; }
  var m = motor;
  motor = null;
  try{
    m.gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.1);
    m.osc.stop(actx.currentTime + 0.16);
  }catch(e){ /* already stopped */ }
}

/* ============================================================
   BUILD THE PILE
   ============================================================ */
function buildPile(){
  var rows = [
    { bottom: 2,  count: 9, size: 26, spread: [5, 95] },
    { bottom: 20, count: 7, size: 23, spread: [10, 90] },
    { bottom: 38, count: 5, size: 20, spread: [18, 82] }
  ];
  var e = 0, c = 0;
  for(var r = 0; r < rows.length; r++){
    var row = rows[r];
    var span = row.spread[1] - row.spread[0];
    for(var i = 0; i < row.count; i++){
      var x = row.spread[0] + (span * i) / (row.count - 1);
      var isBall = ((r + i) % 3 === 0);
      var node;
      if(isBall){
        node = document.createElement('div');
        node.className = 'ball';
        var col = CONFIG.ballColors[c % CONFIG.ballColors.length];
        c++;
        var d = row.size - 2;
        node.style.width = d + 'px';
        node.style.height = d + 'px';
        node.style.background = 'radial-gradient(circle at 34% 30%, #ffffff 2%, ' + col + ' 45%, rgba(0,0,0,.45) 130%)';
      }else{
        node = document.createElement('span');
        node.className = 'item';
        node.textContent = CONFIG.pileEmoji[e % CONFIG.pileEmoji.length];
        e++;
        node.style.fontSize = row.size + 'px';
        node.style.setProperty('--rot', (((i * 37 + r * 11) % 24) - 12) + 'deg');
        node.style.animationDelay = ((i * 0.23 + r * 0.4) % 3.2) + 's';
      }
      node.style.left = x + '%';
      node.style.bottom = (row.bottom + ((i * 13 + r * 7) % 7)) + '%';
      node.style.transform = 'translateX(-50%)';
      node.style.zIndex = String(10 - r);
      pile.appendChild(node);
    }
  }
}

/* ============================================================
   UI HELPERS
   ============================================================ */
function say(msg){ ledMsg.textContent = msg; }
function setCredit(n){ credit.textContent = 'CREDIT ' + n; }
function lock(coin, move, grab){
  btnCoin.disabled = !coin;
  btnMove.disabled = !move;
  btnGrab.disabled = !grab;
  btnCoin.classList.toggle('pulse', coin);
  btnMove.classList.toggle('pulse', move);
  btnGrab.classList.toggle('pulse', grab);
}
function shake(){
  cabinet.classList.remove('shake');
  void cabinet.offsetWidth;
  cabinet.classList.add('shake');
}

/* ============================================================
   PARTICLES (hearts / stars on win)
   ============================================================ */
var particles = [];
function burst(x, y, count){
  var glyphs = ['\u2764', '\u2728', '\u2B50', '\uD83D\uDC96', '\uD83C\uDF89'];
  var n = Math.min(count || 22, 34);
  for(var i = 0; i < n; i++){
    var el = document.createElement('div');
    el.className = 'pt';
    el.textContent = glyphs[i % glyphs.length];
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    var a = (Math.PI * 2 * i) / n + Math.random() * 0.4;
    var sp = 3.2 + Math.random() * 4.4;
    particles.push({
      el: el, x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 4,
      life: 1, rot: 0, spin: (Math.random() - 0.5) * 16
    });
  }
}
function stepParticles(){
  for(var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.vy += 0.26;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.spin;
    p.life -= 0.016;
    if(p.life <= 0){
      if(p.el.parentNode){ p.el.parentNode.removeChild(p.el); }
      particles.splice(i, 1);
      continue;
    }
    p.el.style.transform = 'translate(' + (p.x - parseFloat(p.el.style.left)) + 'px,' + (p.y - parseFloat(p.el.style.top)) + 'px) rotate(' + p.rot + 'deg)';
    p.el.style.opacity = String(Math.max(0, p.life));
  }
}

/* ============================================================
   MAIN LOOP - single requestAnimationFrame
   ============================================================ */
function loop(){
  if(state.moving){
    state.x += CONFIG.clawSpeed * state.dir;
    if(state.x >= CONFIG.maxX){ state.x = CONFIG.maxX; state.dir = -1; }
    if(state.x <= CONFIG.minX){ state.x = CONFIG.minX; state.dir = 1; }
    trolley.style.left = state.x + '%';
  }
  stepParticles();
  requestAnimationFrame(loop);
}

/* ============================================================
   CLAW SEQUENCE
   ============================================================ */
function setClawX(pct, smooth){
  if(smooth){ trolley.classList.add('smooth'); }
  else{ trolley.classList.remove('smooth'); }
  state.x = pct;
  trolley.style.left = pct + '%';
}

function descendTo(targetEl, done){
  var pr = targetEl.getBoundingClientRect();
  var cw = clawWrap.getBoundingClientRect();
  var cur = parseFloat(cable.style.height || CABLE_REST);
  var delta = (pr.top + pr.height * 0.42) - (cw.top + 54);
  var next = Math.max(CABLE_REST, cur + delta);
  cable.style.height = next + 'px';
  sfxServo();
  setTimeout(done, 1000);
}

function retract(done){
  cable.style.height = CABLE_REST + 'px';
  sfxServo();
  setTimeout(done, 1050);
}

function insertCoin(){
  initAudio();
  if(state.busy || state.credit > 0){ return; }
  state.credit = 1;
  setCredit(1);
  sfxCoin();
  var coin = $('coinAnim');
  coin.classList.remove('go');
  void coin.offsetWidth;
  coin.classList.add('go');
  say('CREDIT ACCEPTED - PRESS MOVE CLAW');
  lock(false, true, false);
}

function startMove(){
  initAudio();
  if(state.busy || state.credit < 1){ return; }
  state.moving = true;
  motorStart();
  say('PRESS PICK PRIZE TO STOP');
  lock(false, false, true);
}

function pickPrize(){
  if(!state.moving || state.busy){ return; }
  state.moving = false;
  state.busy = true;
  state.tries++;
  motorStop();
  sfxBeep();
  lock(false, false, false);
  trolley.classList.remove('smooth');

  var dist = Math.abs(state.x - CONFIG.prizeX);
  var hit = CONFIG.guaranteedWin || dist <= CONFIG.grabTolerance || state.tries >= 3;

  if(hit){
    say('LOCKED ON - DROPPING CLAW');
    prize.style.left = state.x + '%';
    prize.style.transform = 'translateX(-50%)';
    setTimeout(function(){ grabSequence(true); }, 420);
  }else{
    say('DROPPING CLAW');
    setTimeout(function(){ grabSequence(false); }, 300);
  }
}

function grabSequence(isWin){
  clawWrap.classList.add('open');
  var target = isWin ? prize : pile;

  descendTo(target, function(){
    clawWrap.classList.remove('open');
    sfxClank();
    shake();

    setTimeout(function(){
      if(isWin){
        held.appendChild(prize);
        prize.style.left = '50%';
        prize.style.bottom = 'auto';
        prize.style.top = '0px';
        prize.style.transform = 'translateX(-50%)';
      }else{
        var dud = document.createElement('div');
        dud.className = 'held-dud';
        dud.style.fontSize = '26px';
        dud.textContent = CONFIG.pileEmoji[state.tries % CONFIG.pileEmoji.length];
        held.appendChild(dud);
      }

      retract(function(){
        if(isWin){ deliverPrize(); }
        else{ missPrize(); }
      });
    }, 420);
  });
}

function missPrize(){
  say('SO CLOSE - IT SLIPPED');
  setTimeout(function(){
    clawWrap.classList.add('open');
    sfxFail();
    var dud = held.firstChild;
    if(dud){
      dud.style.transition = 'transform .6s ease-in, opacity .6s';
      dud.style.transform = 'translateY(130px) rotate(50deg)';
      dud.style.opacity = '0';
      setTimeout(function(){ if(dud.parentNode){ dud.parentNode.removeChild(dud); } }, 650);
    }
    setTimeout(function(){
      state.busy = false;
      say('FREE RETRY - PRESS MOVE CLAW');
      lock(false, true, false);
    }, 800);
  }, 350);
}

function deliverPrize(){
  say('MOVING TO PRIZE CHUTE');
  setClawX(CONFIG.chuteX, true);
  setTimeout(function(){
    clawWrap.classList.add('open');
    sfxServo();
    prize.classList.add('dropping');
    setTimeout(function(){
      sfxThud();
      chute.classList.add('lit');
      shake();
      prize.classList.add('hidden');
      winScreenReady();
    }, 640);
  }, 1250);
}

function winScreenReady(){
  state.won = true;
  state.credit = 0;
  setCredit(0);
  say('GRAND PRIZE WON - COLLECT BELOW');
  sfxWin();
  door.classList.add('lit');
  var r = door.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 26);
}

/* ============================================================
   LETTER PAGE
   ============================================================ */

/* Tanggal hari ini, waktu lokal pembuka halaman, format DD-MM-YYYY. */
function todayDDMMYYYY(){
  var d = new Date();
  var dd = String(d.getDate());
  var mm = String(d.getMonth() + 1);
  if(dd.length < 2){ dd = '0' + dd; }
  if(mm.length < 2){ mm = '0' + mm; }
  return dd + '-' + mm + '-' + d.getFullYear();
}

function fillLetter(){
  $('tKicker').textContent = CONFIG.ticketKicker;
  $('tTitle').textContent = CONFIG.letterTitle;
  $('tSerial').textContent = CONFIG.serialPrefix + ' ' + todayDDMMYYYY() + ' / ' + CONFIG.serialSuffix;
  $('photoCap').textContent = CONFIG.photoCaption;
  $('signFrom').textContent = CONFIG.signFrom;
  $('signName').textContent = CONFIG.senderName;
  $('footNote').textContent = CONFIG.footNote;

  var body = $('letterBody');
  body.innerHTML = '';
  var greet = document.createElement('p');
  greet.className = 'lead';
  greet.textContent = 'Dear ' + CONFIG.recipientName + ',';
  body.appendChild(greet);
  for(var i = 0; i < CONFIG.letterParagraphs.length; i++){
    var p = document.createElement('p');
    p.textContent = CONFIG.letterParagraphs[i];
    body.appendChild(p);
  }

  /* photo: hidden by default, revealed only on successful load */
  var img = $('photo');
  img.alt = CONFIG.recipientName;
  img.onload = function(){ $('photoWrap').classList.remove('hidden'); };
  img.onerror = function(){ $('photoWrap').classList.add('hidden'); };
  img.src = CONFIG.ASSET_BASE + CONFIG.photoFile;
}

function openLetter(){
  if(!state.won){ return; }
  /* music must start inside this gesture handler */
  if(CONFIG.musicFile){
    bgm.src = CONFIG.ASSET_BASE + CONFIG.musicFile;
    bgm.volume = CONFIG.musicVolume;
    var pr = bgm.play();
    if(pr && pr.catch){ pr.catch(function(){ /* blocked, ignore */ }); }
  }
  sfxWin();
  pageMachine.classList.add('hidden');
  pageLetter.classList.remove('hidden');
  window.scrollTo(0, 0);
  setTimeout(function(){ $('ticket').classList.add('in'); }, 80);
  setTimeout(function(){ burst(window.innerWidth / 2, window.innerHeight * 0.3, 28); }, 500);
}

function resetMachine(){
  state.credit = 0;
  state.moving = false;
  state.busy = false;
  state.won = false;
  state.tries = 0;
  state.dir = 1;
  motorStop();

  cable.style.height = CABLE_REST + 'px';
  clawWrap.classList.add('open');
  trolley.classList.remove('smooth');
  setClawX(50, false);

  if(prize.parentNode !== playfield){ playfield.appendChild(prize); }
  prize.classList.remove('dropping', 'hidden');
  prize.style.left = CONFIG.prizeX + '%';
  prize.style.top = 'auto';
  prize.style.bottom = '30%';
  prize.style.transform = 'translateX(-50%)';
  held.innerHTML = '';
  chute.classList.remove('lit');
  door.classList.remove('lit');

  setCredit(0);
  say('INSERT COIN TO PLAY');
  lock(true, false, false);
}

function playAgain(){
  bgm.pause();
  bgm.currentTime = 0;
  $('ticket').classList.remove('in');
  pageLetter.classList.add('hidden');
  pageMachine.classList.remove('hidden');
  window.scrollTo(0, 0);
  resetMachine();
}

/* ============================================================
   INIT
   ============================================================ */
function startGame(){
  if(state.started){ return; }
  state.started = true;
  initAudio();
  sfxCoin();
  pageGate.classList.add('hidden');
  pageMachine.classList.remove('hidden');
  resetMachine();
}

(function init(){
  $('gateTitle').textContent = CONFIG.gateTitle;
  $('gateSub').textContent = CONFIG.gateSub;
  $('marqTitle').textContent = CONFIG.marqueeTitle;
  $('marqSub').textContent = CONFIG.marqueeSub;
  document.title = CONFIG.marqueeTitle;

  /* marquee bulbs */
  var bulbs = $('bulbs');
  for(var i = 0; i < 11; i++){
    var b = document.createElement('div');
    b.className = 'bulb';
    b.style.animationDelay = (i * 0.11) + 's';
    bulbs.appendChild(b);
  }

  buildPile();
  fillLetter();

  cable.style.height = CABLE_REST + 'px';
  prize.style.left = CONFIG.prizeX + '%';
  prize.style.bottom = '30%';
  prize.style.transform = 'translateX(-50%)';

  pageGate.addEventListener('click', startGame);
  btnCoin.addEventListener('click', insertCoin);
  btnMove.addEventListener('click', startMove);
  btnGrab.addEventListener('click', pickPrize);
  door.addEventListener('click', openLetter);
  $('btnReplay').addEventListener('click', playAgain);

  $('sfxBtn').addEventListener('click', function(e){
    e.stopPropagation();
    sfxOn = !sfxOn;
    $('sfxBtn').innerHTML = sfxOn ? '&#128266;' : '&#128263;';
    if(!sfxOn){ motorStop(); }
  });

  document.addEventListener('keydown', function(e){
    if(e.key === ' ' || e.key === 'Enter'){
      if(!state.started){ startGame(); }
    }
  });

  requestAnimationFrame(loop);
})();
</script>
