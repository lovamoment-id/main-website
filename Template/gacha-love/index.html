<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gacha Kita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Sacramento&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root{
  --pink:#f2789f;
  --pink-hi:#ffa2c0;
  --pink-lo:#c9527a;
  --pink-soft:#ffd7e5;

  --gold:#e6bd6e;
  --gold-hi:#fbe7b8;
  --gold-lo:#a4772f;

  --chrome:#dbe3ea;
  --chrome-lo:#8b98a5;

  --cream:#fffaf3;
  --cream-2:#f4e7d5;

  --plum:#4e2a3c;
  --plum-2:#7a5265;
  --deep:#3a1e2c;

  --mint:#7fd8d0;

  --ffDisplay:'Fraunces',serif;
  --ffLetter:'Cormorant Garamond',serif;
  --ffSign:'Sacramento',cursive;
  --ffUI:'Jost',sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  background:
    radial-gradient(62% 42% at 6% 96%, rgba(127,216,208,.50), rgba(127,216,208,0) 70%),
    radial-gradient(62% 42% at 96% 90%, rgba(255,214,150,.52), rgba(255,214,150,0) 70%),
    radial-gradient(118% 80% at 50% 4%, #fffdf8 0%, #fff0f6 32%, #ffdcea 64%, #ffc7dd 100%);
  color:var(--plum);
  font-family:var(--ffUI);
  overflow:hidden;
  position:fixed;
  inset:0;
  touch-action:manipulation;
}
.hidden{display:none !important;}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;}

/* soft grounding shadow under the machine */
#floor{
  position:fixed;left:50%;bottom:10vh;transform:translateX(-50%);
  width:min(74vw,400px);height:64px;z-index:1;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%, rgba(140,70,105,.26), rgba(140,70,105,0) 72%);
  filter:blur(3px);
}

#stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#scaler{transform-origin:center center;}

/* =========================================================
   THE MACHINE
   ========================================================= */
#machine{position:relative;width:320px;height:590px;}

/* ---- topper sign ---- */
.topper{
  position:absolute;left:34px;top:0;width:252px;height:74px;z-index:6;
  border-radius:16px 16px 6px 6px;
  background:linear-gradient(180deg,var(--pink-hi),var(--pink) 42%,var(--pink-lo));
  border:3px solid var(--gold);
  box-shadow:0 10px 22px rgba(150,70,105,.32), inset 0 2px 0 rgba(255,255,255,.55), inset 0 -10px 18px rgba(140,50,85,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.topper:before{content:'';position:absolute;left:9px;right:9px;top:6px;height:1px;background:rgba(255,255,255,.45);}
.topTitle{
  font-family:var(--ffDisplay);font-weight:700;font-size:23px;letter-spacing:.10em;
  color:#fffdf9;text-shadow:0 2px 0 rgba(150,50,85,.45);line-height:1;padding-left:.10em;
}
.topNames{
  font-family:var(--ffUI);font-weight:400;font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;
  color:rgba(255,255,255,.9);margin-top:10px;padding-left:.36em;
}

/* ---- glass globe ---- */
.globeWrap{position:absolute;left:30px;top:56px;width:260px;height:262px;z-index:4;}
.globe{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:
    radial-gradient(circle at 33% 25%, rgba(255,255,255,.85), rgba(255,255,255,.22) 34%, rgba(255,255,255,.04) 58%),
    radial-gradient(circle at 50% 116%, rgba(150,80,115,.30), rgba(150,80,115,0) 58%),
    linear-gradient(160deg, rgba(255,255,255,.55), rgba(210,235,240,.30));
  border:2px solid rgba(255,255,255,.9);
  box-shadow:
    inset 12px 14px 34px rgba(255,255,255,.75),
    inset -18px -22px 46px rgba(160,95,125,.28),
    0 18px 36px rgba(150,70,105,.28);
}
.globe:after{
  content:'';position:absolute;left:26px;top:22px;width:78px;height:44px;border-radius:50%;
  background:linear-gradient(140deg, rgba(255,255,255,.95), rgba(255,255,255,0));
  transform:rotate(-24deg);filter:blur(1px);pointer-events:none;z-index:5;
}
.globeRing{
  position:absolute;left:-6px;bottom:-4px;width:272px;height:44px;border-radius:0 0 24px 24px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 42%,var(--gold-lo));
  box-shadow:0 6px 14px rgba(150,70,105,.30), inset 0 2px 0 rgba(255,255,255,.75);
  z-index:5;
}
.ball{
  position:absolute;width:34px;height:34px;border-radius:50%;
  box-shadow:inset -4px -6px 10px rgba(120,60,90,.28), 0 3px 6px rgba(120,60,90,.22);
}
.ball:after{
  content:'';position:absolute;left:0;right:0;top:50%;height:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));
}
@keyframes jig{
  0%{transform:translate(0,0) rotate(0deg);}
  25%{transform:translate(-3px,-4px) rotate(-8deg);}
  50%{transform:translate(3px,-2px) rotate(6deg);}
  75%{transform:translate(-2px,3px) rotate(-4deg);}
  100%{transform:translate(0,0) rotate(0deg);}
}
.globe.churn .ball{animation:jig .34s linear infinite;}
@keyframes shakeG{
  0%,100%{transform:translate(0,0) rotate(0deg);}
  20%{transform:translate(-2px,1px) rotate(-.5deg);}
  40%{transform:translate(2px,-1px) rotate(.5deg);}
  60%{transform:translate(-1px,-1px) rotate(-.3deg);}
  80%{transform:translate(1px,1px) rotate(.3deg);}
}
.globeWrap.churn{animation:shakeG .18s linear infinite;}

/* ---- body ---- */
.body{
  position:absolute;left:6px;top:294px;width:308px;height:216px;z-index:5;
  border-radius:18px 18px 8px 8px;
  background:linear-gradient(180deg,var(--pink-hi) 0%,var(--pink) 28%,#e0648c 70%,var(--pink-lo) 100%);
  box-shadow:0 22px 42px rgba(150,70,105,.34), inset 0 2px 0 rgba(255,255,255,.6),
    inset -14px 0 26px rgba(150,60,95,.26), inset 14px 0 22px rgba(255,255,255,.20);
}
.bandTop{
  position:absolute;left:0;right:0;top:0;height:16px;border-radius:16px 16px 0 0;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));
  box-shadow:0 3px 8px rgba(150,70,105,.28);
}

/* knob */
.knob{
  position:absolute;left:28px;top:30px;width:88px;height:88px;border-radius:50%;border:0;padding:0;
  background:radial-gradient(circle at 34% 28%, #ffffff, var(--chrome) 34%, #a9b6c2 66%, #74808d 100%);
  box-shadow:0 8px 16px rgba(120,55,85,.42), inset 0 0 0 4px rgba(255,255,255,.6), inset 0 -8px 14px rgba(90,70,90,.30);
  cursor:pointer;z-index:7;transition:transform .9s cubic-bezier(.2,.8,.25,1);
}
.knob:before{
  content:'';position:absolute;left:50%;top:12px;width:12px;height:64px;margin-left:-6px;border-radius:6px;
  background:linear-gradient(180deg,#9aa6b2,#5b6773);
  box-shadow:inset 1px 0 0 rgba(255,255,255,.6), 0 2px 4px rgba(90,60,80,.4);
}
.knob:after{
  content:'';position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, var(--gold-hi), var(--gold) 50%, var(--gold-lo));
  box-shadow:0 2px 4px rgba(120,70,40,.5);
}
.knob.turn{transform:rotate(360deg);}
@keyframes knobPulse{
  0%,100%{box-shadow:0 8px 16px rgba(120,55,85,.42), inset 0 0 0 4px rgba(255,255,255,.6), inset 0 -8px 14px rgba(90,70,90,.30), 0 0 0 0 rgba(255,255,255,.85);}
  70%{box-shadow:0 8px 16px rgba(120,55,85,.42), inset 0 0 0 4px rgba(255,255,255,.6), inset 0 -8px 14px rgba(90,70,90,.30), 0 0 0 20px rgba(255,255,255,0);}
}
.knob.ready{animation:knobPulse 2.1s ease-out infinite;}

/* coin plate */
.coinPlate{
  position:absolute;right:26px;top:34px;width:96px;height:80px;border-radius:9px;
  background:linear-gradient(180deg,#ffffff,var(--chrome) 48%,#9fadb9);
  box-shadow:0 6px 12px rgba(120,55,85,.34), inset 0 1px 0 rgba(255,255,255,.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
}
.slot{
  width:52px;height:7px;border-radius:4px;background:linear-gradient(180deg,#3a2c36,#5f5060);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.85);
}
.coinTxt{font-family:var(--ffDisplay);font-weight:700;font-size:10px;letter-spacing:.20em;color:#57626d;padding-left:.20em;}

/* name plate */
.plate{
  position:absolute;left:26px;right:26px;top:128px;height:26px;border-radius:6px;
  background:linear-gradient(180deg,var(--cream),#f3e3d2);
  border:2px solid var(--gold);
  box-shadow:inset 0 2px 5px rgba(150,100,70,.22), 0 2px 0 rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
}
.plate span{font-family:var(--ffUI);font-weight:500;font-size:10px;letter-spacing:.32em;color:var(--plum-2);padding-left:.32em;}

/* chute */
.chute{
  position:absolute;left:84px;top:162px;width:140px;height:46px;border-radius:8px 8px 0 0;
  background:linear-gradient(180deg,#2c1620,#4a2a39);
  box-shadow:inset 0 6px 14px rgba(0,0,0,.75), 0 -2px 0 rgba(255,255,255,.30);
  overflow:hidden;z-index:6;
}
.flap{
  position:absolute;left:6px;right:6px;top:4px;height:36px;border-radius:5px;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(220,238,245,.40));
  border:1px solid rgba(255,255,255,.75);
  transform-origin:top center;transition:transform .34s ease;
  box-shadow:inset 0 8px 14px rgba(255,255,255,.4);
}
.flap.open{transform:rotateX(78deg);}

/* tray */
.tray{
  position:absolute;left:62px;top:504px;width:196px;height:52px;z-index:7;
  border-radius:6px 6px 14px 14px;
  background:linear-gradient(180deg,#33192a 0%,#54293e 40%,#2a1322 100%);
  box-shadow:inset 0 8px 16px rgba(0,0,0,.7), 0 10px 20px rgba(140,70,105,.32);
}
.trayLip{
  position:absolute;left:50px;top:540px;width:220px;height:16px;z-index:9;border-radius:6px;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));
  box-shadow:0 6px 12px rgba(140,70,105,.34);
}
.base{
  position:absolute;left:22px;top:550px;width:276px;height:26px;z-index:6;border-radius:6px 6px 12px 12px;
  background:linear-gradient(180deg,#6b3b52,var(--deep));
  box-shadow:0 20px 30px rgba(140,70,105,.35);
}

/* ---- the capsule ---- */
#capsule{
  position:absolute;left:50%;top:456px;width:62px;height:62px;margin-left:-31px;z-index:8;
  cursor:pointer;transform:translateY(0);
}
.capHalf{position:absolute;left:0;width:62px;height:31px;transition:transform .5s cubic-bezier(.3,1.4,.5,1), opacity .5s ease;}
.capTop{top:0;border-radius:31px 31px 0 0;
  box-shadow:inset -5px -2px 10px rgba(110,60,85,.25), inset 5px 6px 12px rgba(255,255,255,.6);}
.capBot{top:31px;border-radius:0 0 31px 31px;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(238,242,246,.8));
  box-shadow:inset -5px 4px 10px rgba(110,60,85,.18), 0 4px 8px rgba(110,60,85,.3);}
.capSeam{position:absolute;left:-2px;top:28px;width:66px;height:6px;border-radius:3px;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(200,208,216,.8));z-index:3;
  box-shadow:0 1px 2px rgba(110,60,85,.28);transition:opacity .3s ease;}
#capsule.open .capTop{transform:translate(-46px,-72px) rotate(-52deg);opacity:0;}
#capsule.open .capBot{transform:translate(44px,50px) rotate(46deg);opacity:0;}
#capsule.open .capSeam{opacity:0;}
@keyframes drop{
  0%{transform:translateY(-6px) scale(.72);opacity:0;}
  16%{transform:translateY(10px) scale(.94);opacity:1;}
  52%{transform:translateY(48px) scale(1);}
  66%{transform:translateY(28px) scale(1);}
  80%{transform:translateY(48px) scale(1);}
  90%{transform:translateY(40px) scale(1);}
  100%{transform:translateY(48px) scale(1);}
}
#capsule.dropping{animation:drop 1.05s cubic-bezier(.4,.05,.6,1) forwards;}
#capsule.landed{transform:translateY(48px);}
@keyframes bob{0%,100%{transform:translateY(48px);}50%{transform:translateY(40px);}}
#capsule.landed.wiggle{animation:bob 1.5s ease-in-out infinite;}
#capsule.landed.wiggle:after{
  content:'';position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(255,255,255,.9);
  animation:halo 1.9s ease-out infinite;
}
@keyframes halo{0%{transform:scale(.8);opacity:.95;}100%{transform:scale(1.35);opacity:0;}}

/* =========================================================
   HUD
   ========================================================= */
#hint{
  position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));z-index:20;
  text-align:center;font-size:12px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;
  color:var(--plum-2);padding-left:.26em;transition:opacity .3s ease;pointer-events:none;
}
#resetBtn{
  position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top));z-index:22;
  font-family:var(--ffUI);font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
  color:var(--pink-lo);background:rgba(255,255,255,.86);border:1.5px solid rgba(242,120,159,.45);
  padding:9px 14px 9px 16px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);
  box-shadow:0 4px 12px rgba(150,70,105,.18);
}
#resetBtn:active{transform:scale(.96);}
#nowPlaying{
  position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top));z-index:22;
  display:flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.86);border:1.5px solid rgba(242,120,159,.35);
  padding:8px 14px 8px 11px;border-radius:999px;backdrop-filter:blur(6px);cursor:pointer;max-width:52vw;
  box-shadow:0 4px 12px rgba(150,70,105,.18);
}
.eq{display:flex;align-items:flex-end;gap:2.5px;height:13px;}
.eq i{width:2.5px;background:var(--pink);border-radius:2px;animation:eqa .9s ease-in-out infinite;}
.eq i:nth-child(1){height:5px;animation-delay:0s;}
.eq i:nth-child(2){height:12px;animation-delay:.18s;}
.eq i:nth-child(3){height:8px;animation-delay:.36s;}
.eq i:nth-child(4){height:13px;animation-delay:.54s;}
@keyframes eqa{0%,100%{transform:scaleY(.35);}50%{transform:scaleY(1);}}
#nowPlaying.paused .eq i{animation-play-state:paused;opacity:.4;}
#npTitle{font-size:11px;font-weight:400;letter-spacing:.1em;color:var(--plum);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* toast for the party spins */
#toast{
  position:fixed;left:50%;top:24%;transform:translate(-50%,-8px);z-index:30;
  background:rgba(255,255,255,.94);border:2px solid rgba(230,189,110,.6);
  padding:16px 24px;border-radius:18px;text-align:center;max-width:78vw;
  opacity:0;transition:opacity .35s ease, transform .35s ease;pointer-events:none;
  box-shadow:0 16px 34px rgba(150,70,105,.24);
}
#toast.show{opacity:1;transform:translate(-50%,0);}
#toast b{display:block;font-family:var(--ffDisplay);font-weight:700;font-size:19px;color:var(--pink-lo);margin-bottom:5px;}
#toast span{font-size:12.5px;font-weight:300;letter-spacing:.04em;color:var(--plum-2);}

/* =========================================================
   REVEAL OVERLAY
   ========================================================= */
#overlay{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(96,48,72,.52);backdrop-filter:blur(10px);
  opacity:0;transition:opacity .38s ease;
}
#overlay.show{opacity:1;}
#card{
  width:100%;max-width:360px;max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(18px) scale(.96);transition:transform .45s cubic-bezier(.2,.9,.3,1);
}
#overlay.show #card{transform:translateY(0) scale(1);}
#closeBtn{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:44;
  font-family:var(--ffUI);font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;
  color:#fff;background:linear-gradient(180deg,var(--pink-hi),var(--pink));
  border:0;padding:14px 32px 14px 36px;border-radius:999px;cursor:pointer;
  box-shadow:0 10px 24px rgba(90,40,65,.4);
}
#closeBtn:active{transform:translateX(-50%) scale(.97);}

/* music card */
.mCard{
  background:linear-gradient(168deg,var(--cream),#fdeef3);
  border:2px solid rgba(230,189,110,.55);border-radius:22px;padding:34px 26px 30px;text-align:center;
  box-shadow:0 30px 60px rgba(70,30,50,.4);
}
.disc{
  width:150px;height:150px;margin:0 auto 24px;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle at 50% 50%, #3a2130 0px, #3a2130 2px, #4c2c40 3px, #3a2130 4px);
  box-shadow:0 14px 26px rgba(90,45,70,.4), inset 0 0 0 1px rgba(255,255,255,.14);
  animation:spinDisc 7s linear infinite;
}
@keyframes spinDisc{to{transform:rotate(360deg);}}
.disc:before{content:'';position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, var(--pink-hi), var(--pink) 60%, var(--pink-lo));}
.disc:after{content:'';position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#2a1420;}
.mCard h2{font-family:var(--ffDisplay);font-weight:700;font-size:22px;margin:0 0 8px;color:var(--plum);line-height:1.3;}
.mCard p{font-family:var(--ffUI);font-weight:300;font-size:12.5px;letter-spacing:.08em;margin:0;color:var(--plum-2);}
.mEyebrow{font-family:var(--ffUI);font-weight:500;font-size:10px;letter-spacing:.36em;text-transform:uppercase;
  color:var(--gold-lo);margin-bottom:18px;padding-left:.36em;}

/* letter card */
.lCard{
  background:linear-gradient(172deg,var(--cream) 0%, var(--cream-2) 100%);
  color:var(--plum);border-radius:6px;padding:38px 30px 34px;position:relative;
  box-shadow:0 30px 60px rgba(70,30,50,.42), inset 0 0 60px rgba(190,150,110,.14);
}
.lCard:before{content:'';position:absolute;inset:9px;border:1px solid rgba(160,120,90,.28);border-radius:3px;pointer-events:none;}
.lStamp{
  position:absolute;right:22px;top:-18px;width:58px;height:58px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, var(--pink-hi), var(--pink) 55%, var(--pink-lo));
  box-shadow:0 8px 16px rgba(90,40,65,.35);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;color:#fff5f8;transform:rotate(-9deg);
}
.lEyebrow{font-family:var(--ffUI);font-size:10px;font-weight:500;letter-spacing:.36em;text-transform:uppercase;
  color:var(--gold-lo);margin-bottom:14px;padding-left:.36em;}
.lCard h2{font-family:var(--ffDisplay);font-weight:500;font-size:23px;margin:0 0 18px;color:var(--plum);line-height:1.38;}
.lCard p{font-family:var(--ffLetter);font-size:17.5px;line-height:1.78;margin:0 0 14px;color:#4a3a36;}
.lRule{width:44px;height:2px;background:var(--pink);border-radius:2px;margin:22px 0 16px;}
.lSignLabel{font-family:var(--ffLetter);font-style:italic;font-size:15px;color:var(--plum-2);margin:0 0 2px;}
.lSign{font-family:var(--ffSign);font-size:38px;line-height:1;color:var(--pink-lo);margin:0;}

/* photo card */
.pCard{
  background:linear-gradient(170deg,#fffdf9,#f6ece0);border-radius:4px;padding:14px 14px 0;
  box-shadow:0 30px 60px rgba(70,30,50,.42);transform:rotate(-1.4deg);
}
.pFrame{background:#e8dccd;border-radius:2px;overflow:hidden;line-height:0;}
.pFrame img{width:100%;display:block;}
.pCap{padding:16px 6px 20px;text-align:center;}
.pCap .k{font-family:var(--ffSign);font-size:28px;color:var(--plum);line-height:1.25;}
.pCap .d{font-family:var(--ffUI);font-size:9.5px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;
  color:#a2907c;margin-top:6px;}
.pMiss{padding:44px 20px;text-align:center;font-family:var(--ffUI);font-size:12px;font-weight:300;
  letter-spacing:.06em;color:#9b8874;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;}
}
:focus-visible{outline:2px solid var(--pink-lo);outline-offset:3px;}
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div id="floor"></div>

<div id="stage">
  <div id="scaler">
    <div id="machine">

      <div class="topper">
        <div class="topTitle" id="topTitle">Gacha Cinta</div>
        <div class="topNames" id="topNames">L &amp; Z</div>
      </div>

      <div class="globeWrap" id="globeWrap">
        <div class="globe" id="globe"></div>
        <div class="globeRing"></div>
      </div>

      <div class="body">
        <div class="bandTop"></div>
        <button class="knob ready" id="knob" aria-label="Putar gacha"></button>
        <div class="coinPlate">
          <div class="slot"></div>
          <div class="coinTxt" id="coinTxt">1 KOIN</div>
          <div class="slot" style="width:30px;height:5px;"></div>
        </div>
        <div class="plate"><span id="plateTxt">PUTAR AKU</span></div>
        <div class="chute"><div class="flap" id="flap"></div></div>
      </div>

      <div class="tray"></div>
      <div class="trayLip"></div>
      <div class="base"></div>

      <div id="capsule" class="hidden">
        <div class="capHalf capTop" id="capTop"></div>
        <div class="capSeam"></div>
        <div class="capHalf capBot"></div>
      </div>

    </div>
  </div>
</div>

<div id="nowPlaying" class="hidden">
  <div class="eq"><i></i><i></i><i></i><i></i></div>
  <div id="npTitle"></div>
</div>

<button id="resetBtn" class="hidden">Ulang</button>
<div id="hint">Putar tuasnya</div>
<div id="toast"><b id="toastT"></b><span id="toastS"></span></div>

<div id="overlay" class="hidden">
  <div id="card"></div>
  <button id="closeBtn">Lanjut</button>
</div>

<audio id="bgm" loop preload="auto"></audio>

<script>
/* =========================================================
   CONFIG  —  edit everything here
   ========================================================= */
var LOVAMOMENT_ASSET_BASE = '__LOVAMOMENT_ASSET_BASE__';
if (LOVAMOMENT_ASSET_BASE.indexOf('LOVAMOMENT_ASSET_BASE') !== -1) {
  LOVAMOMENT_ASSET_BASE = '';
}
var CONFIG = {
  ASSET_BASE: LOVAMOMENT_ASSET_BASE,
  /* header sign */
  topTitle    : "Gacha Cinta",
  names       : "Leo &amp; Zia",
  plateText   : "SPIN ME",
  coinText    : "1 KOIN",

  /* music (hadiah ke-1) */
  musicFile   : "music.mp3",
  musicTitle  : "Lagu Kita",
  musicArtist : "diputar khusus buat kamu",
  musicEyebrow: "Hadiah pertama",

  /* letter (hadiah ke-2) */
  letterEyebrow : "Surat untukmu",
  letterTitle   : "For my Zia, yang selalu membuat hariku hangat",
  letterBody    : [
    "Leo tau Zia lagi punya hari yang berat. Semoga mesin kecil ini bisa bikin hari kamu sedikit lebih baik.",
    "Setiap kali diputar, yang keluar selalu hal yang sama: Leo, yang tetap memilih kamu."
  ],
  letterSignLabel : "Forever yours,",
  letterSign      : "Leo",
  letterStamp     : "\u2665",

  /* photos (hadiah ke-3 dan seterusnya) — image1.jpg ... image(n).jpg */
  photoCount   : 3,
  photoCaptions: [
    "🤍🤍🤍",
    " ",
    "💞"
  ],
  photoDates   : ["", "", ""],

  /* party spins (setelah semua hadiah keluar) */
  partyMessages : [
    ["Yeay!",  "Kapsulnya habis, Cintanya enggak. Putar lagi sepuasnya."],
    ["Lagi!",  "Isinya sama terus: I Love You."],
    ["Hore!",  "Konfeti lagi? Boleh. Kamu pantas dirayain."],
    ["Selalu", "Selesai semua hadiahnya. Tapi rasa sayangnya gak selesai."]
  ],

  /* look & feel */
  capsuleCount : 17,
  soundOn      : true,
  petalCount   : 16
};
/* __LOVAMOMENT_ORDER_FIELDS__ */

/* =========================================================
   SHORTCUTS
   ========================================================= */
function $(id){ return document.getElementById(id); }
var knob     = $('knob');
var globe    = $('globe');
var globeWrap= $('globeWrap');
var flap     = $('flap');
var capsule  = $('capsule');
var capTop   = $('capTop');
var overlay  = $('overlay');
var card     = $('card');
var closeBtn = $('closeBtn');
var resetBtn = $('resetBtn');
var hint     = $('hint');
var toast    = $('toast');
var bgm      = $('bgm');
var nowP     = $('nowPlaying');

var BALLC = ['#ff8fb1','#ffd06e','#7fd8d0','#ffffff','#ff9e7a','#a9dd9f','#c9a0ff','#8fd4ff'];

var state = { spin:0, busy:false, capsuleReady:false, overlayOpen:false, musicStarted:false, toastTimer:null };
var prizes = [];

/* =========================================================
   SETUP
   ========================================================= */
function buildPrizeList(){
  prizes = ['music','letter'];
  for(var i=1;i<=CONFIG.photoCount;i++){ prizes.push('photo:'+i); }
}

function shade(hex){
  var n = parseInt(hex.slice(1),16);
  var r = Math.max(0,((n>>16)&255)-62);
  var g = Math.max(0,((n>>8)&255)-62);
  var b = Math.max(0,(n&255)-62);
  return 'rgb('+r+','+g+','+b+')';
}

function buildBalls(){
  globe.innerHTML = '';
  var R = 130, br = 17;
  for(var i=0;i<CONFIG.capsuleCount;i++){
    var a  = Math.random()*Math.PI*2;
    var rr = Math.sqrt(Math.random())*(R-br-10);
    var x  = R + Math.cos(a)*rr - br;
    var y  = R + Math.sin(a)*rr*0.85 + 20 - br;
    if(y > R*2 - br*2 - 8){ y = R*2 - br*2 - 8; }
    var c = BALLC[i % BALLC.length];
    var d = document.createElement('div');
    d.className = 'ball';
    d.style.left = x.toFixed(1)+'px';
    d.style.top  = y.toFixed(1)+'px';
    d.style.background = 'radial-gradient(circle at 32% 27%, #ffffff 0%, '+c+' 44%, '+shade(c)+' 100%)';
    d.style.animationDelay = (-Math.random()*2).toFixed(2)+'s';
    globe.appendChild(d);
  }
}

function applyConfig(){
  $('topTitle').innerHTML = CONFIG.topTitle;
  $('topNames').innerHTML = CONFIG.names;
  $('plateTxt').innerHTML = CONFIG.plateText;
  $('coinTxt').innerHTML  = CONFIG.coinText;
  bgm.src = CONFIG.ASSET_BASE + CONFIG.musicFile;
  $('npTitle').innerHTML  = CONFIG.musicTitle;
}

function fitMachine(){
  var pad = 34;
  var availW = window.innerWidth  - pad*2;
  var availH = window.innerHeight - 118;
  var s = Math.min(availW/320, availH/590, 1.12);
  if(s < 0.42){ s = 0.42; }
  $('scaler').style.transform = 'scale('+s.toFixed(3)+')';
}
window.addEventListener('resize', fitMachine);
window.addEventListener('orientationchange', function(){ setTimeout(fitMachine,180); });

/* =========================================================
   SOUND  (WebAudio — no extra asset needed)
   ========================================================= */
var AC = null, noiseBuf = null;
function ac(){
  if(!CONFIG.soundOn) return null;
  if(!AC){
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    AC = new C();
  }
  if(AC.state === 'suspended'){ AC.resume(); }
  return AC;
}
function noise(){
  var c = ac(); if(!c) return null;
  if(!noiseBuf){
    var len = c.sampleRate * 1.2;
    noiseBuf = c.createBuffer(1, len, c.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for(var i=0;i<len;i++){ d[i] = Math.random()*2-1; }
  }
  var s = c.createBufferSource();
  s.buffer = noiseBuf;
  return s;
}
function click(t, freq, vol){
  var c = ac(); if(!c) return;
  var s = noise(); if(!s) return;
  var f = c.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 6;
  var g = c.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0008, t+0.055);
  s.connect(f); f.connect(g); g.connect(c.destination);
  s.start(t); s.stop(t+0.08);
}
function sndCrank(){
  var c = ac(); if(!c) return;
  var t = c.currentTime, gap = 0.038;
  for(var i=0;i<15;i++){
    click(t + i*gap + i*i*0.0022, 1500 + Math.random()*900, 0.22);
  }
  var s = noise(); if(!s) return;
  var f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 900;
  var g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.14, t+0.12);
  g.gain.exponentialRampToValueAtTime(0.0008, t+0.95);
  s.connect(f); f.connect(g); g.connect(c.destination);
  s.start(t); s.stop(t+1.0);
}
function sndThud(){
  var c = ac(); if(!c) return;
  var t = c.currentTime;
  var o = c.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(190, t);
  o.frequency.exponentialRampToValueAtTime(52, t+0.20);
  var g = c.createGain();
  g.gain.setValueAtTime(0.34, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t+0.30);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+0.34);
  click(t, 700, 0.20);
}
function sndPop(){
  var c = ac(); if(!c) return;
  var t = c.currentTime;
  var o = c.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(420, t);
  o.frequency.exponentialRampToValueAtTime(1500, t+0.09);
  var g = c.createGain();
  g.gain.setValueAtTime(0.24, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t+0.16);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+0.2);
}
function sndChime(notes){
  var c = ac(); if(!c) return;
  var t = c.currentTime;
  for(var i=0;i<notes.length;i++){
    var o = c.createOscillator(); o.type = 'sine';
    o.frequency.value = notes[i];
    var g = c.createGain();
    var st = t + i*0.085;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.linearRampToValueAtTime(0.15, st+0.02);
    g.gain.exponentialRampToValueAtTime(0.0006, st+0.55);
    o.connect(g); g.connect(c.destination);
    o.start(st); o.stop(st+0.6);
  }
}

/* =========================================================
   PARTICLE FX  — one rAF loop for everything
   ========================================================= */
var cv = $('fx'), cx = cv.getContext('2d'), W=0, H=0, DPR=1;
var parts = [];
var PETALC = ['#ffffff','#ffb3cd','#ffdf9e','#a8e6de'];
var CONFC  = ['#ff7ba6','#ffc45c','#7fd8d0','#ffffff','#c9a0ff','#ff9e7a','#8fd4ff'];

function sizeFX(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
  cx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', sizeFX);

function petal(){
  return { k:'petal', x:Math.random()*W, y:-20-Math.random()*H,
    vy:0.25+Math.random()*0.45, vx:(Math.random()-0.5)*0.28,
    s:4+Math.random()*5, r:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.03,
    a:0.35+Math.random()*0.35, c:PETALC[(Math.random()*PETALC.length)|0] };
}
function burst(x, y, n, big){
  for(var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2;
    var sp = (big?3.2:2.0) + Math.random()*(big?6.5:4.0);
    parts.push({ k:'conf', x:x, y:y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (big?2.4:1.6),
      w:3+Math.random()*5, h:5+Math.random()*7,
      r:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*0.34,
      life:1, dec:0.0055+Math.random()*0.006,
      c:CONFC[(Math.random()*CONFC.length)|0] });
  }
}
function sparkle(x, y, n){
  for(var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2, sp = 1+Math.random()*3.6;
    parts.push({ k:'spark', x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      s:1+Math.random()*2.2, life:1, dec:0.016+Math.random()*0.018, c:'#ffffff' });
  }
}
function tick(){
  cx.clearRect(0,0,W,H);
  var ambient = 0;
  for(var i=parts.length-1;i>=0;i--){
    var p = parts[i];
    if(p.k === 'petal'){
      ambient++;
      p.y += p.vy; p.x += p.vx + Math.sin(p.y*0.012)*0.35; p.r += p.vr;
      if(p.y > H+30){ p.y = -20; p.x = Math.random()*W; }
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
      cx.globalAlpha = p.a; cx.fillStyle = p.c;
      cx.beginPath(); cx.ellipse(0,0,p.s,p.s*0.55,0,0,Math.PI*2); cx.fill();
      cx.restore();
    } else if(p.k === 'conf'){
      p.vy += 0.11; p.vx *= 0.992; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= p.dec;
      if(p.life <= 0 || p.y > H+40){ parts.splice(i,1); continue; }
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
      cx.globalAlpha = Math.max(0,Math.min(1,p.life));
      cx.fillStyle = p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      cx.restore();
    } else {
      p.vx *= 0.94; p.vy *= 0.94; p.x += p.vx; p.y += p.vy; p.life -= p.dec;
      if(p.life <= 0){ parts.splice(i,1); continue; }
      cx.globalAlpha = Math.max(0,p.life);
      cx.fillStyle = p.c;
      cx.beginPath(); cx.arc(p.x,p.y,p.s,0,Math.PI*2); cx.fill();
    }
  }
  cx.globalAlpha = 1;
  if(ambient < CONFIG.petalCount){ parts.push(petal()); }
  requestAnimationFrame(tick);
}

function capsuleScreenPos(){
  var r = capsule.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

/* =========================================================
   FLOW
   ========================================================= */
function setHint(txt){ hint.innerHTML = txt; }

function currentPrize(){
  if(state.spin <= prizes.length){ return prizes[state.spin-1]; }
  return 'party';
}

function capsuleColorFor(kind){
  if(kind === 'music')  return '#7fd8d0';
  if(kind === 'letter') return '#ff8fb1';
  if(kind.indexOf('photo') === 0) return '#ffd06e';
  return '#c9a0ff';
}

function doSpin(){
  if(state.busy || state.capsuleReady || state.overlayOpen) return;
  state.busy = true;
  state.spin++;
  ac();
  sndCrank();

  knob.classList.remove('ready');
  knob.classList.add('turn');
  globe.classList.add('churn');
  globeWrap.classList.add('churn');
  setHint('Kapsulnya lagi turun…');

  setTimeout(function(){
    knob.classList.remove('turn');
    void knob.offsetWidth;
  }, 950);

  setTimeout(function(){
    globe.classList.remove('churn');
    globeWrap.classList.remove('churn');
    flap.classList.add('open');
  }, 900);

  setTimeout(function(){
    var kind = currentPrize();
    var col  = capsuleColorFor(kind);
    capTop.style.background = 'linear-gradient(160deg, #ffffff 0%, '+col+' 40%, '+shade(col)+' 100%)';
    capsule.classList.remove('hidden','open','landed','wiggle');
    void capsule.offsetWidth;
    capsule.classList.add('dropping');
  }, 1000);

  setTimeout(function(){ sndThud(); }, 1560);

  setTimeout(function(){
    flap.classList.remove('open');
    capsule.classList.remove('dropping');
    capsule.classList.add('landed','wiggle');
    state.busy = false;
    state.capsuleReady = true;
    setHint('Tap kapsulnya');
    resetBtn.classList.remove('hidden');
  }, 2060);
}

function openCapsule(){
  if(!state.capsuleReady || state.busy) return;
  state.capsuleReady = false;
  state.busy = true;

  var kind = currentPrize();
  var p = capsuleScreenPos();

  /* music must start inside this gesture handler */
  if(kind === 'music' && !state.musicStarted){
    var pr = bgm.play();
    if(pr && pr.then){ pr.then(function(){ state.musicStarted = true; }).catch(function(){}); }
    else { state.musicStarted = true; }
    nowP.classList.remove('hidden','paused');
  }

  capsule.classList.remove('wiggle');
  capsule.classList.add('open');
  sndPop();
  sparkle(p.x, p.y, 26);
  burst(p.x, p.y, kind === 'party' ? 90 : 46, kind === 'party');

  if(kind === 'party'){
    sndChime([523.25, 659.25, 783.99, 1046.5]);
    setTimeout(function(){ burst(p.x, p.y-40, 60, true); }, 260);
    showToast();
    setTimeout(function(){
      capsule.classList.add('hidden');
      capsule.classList.remove('open','landed');
      state.busy = false;
      knob.classList.add('ready');
      setHint('Putar lagi kalau mau');
    }, 620);
    return;
  }

  sndChime([659.25, 830.61, 987.77]);
  setTimeout(function(){
    renderCard(kind);
    capsule.classList.add('hidden');
    capsule.classList.remove('open','landed');
    openOverlay();
    state.busy = false;
  }, 480);
}

function showToast(){
  var m = CONFIG.partyMessages[(Math.random()*CONFIG.partyMessages.length)|0];
  $('toastT').innerHTML = m[0];
  $('toastS').innerHTML = m[1];
  toast.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2600);
}

/* ---------- card builders ---------- */
function renderCard(kind){
  card.innerHTML = '';
  if(kind === 'music'){ card.appendChild(buildMusicCard()); return; }
  if(kind === 'letter'){ card.appendChild(buildLetterCard()); return; }
  if(kind.indexOf('photo:') === 0){
    card.appendChild(buildPhotoCard(parseInt(kind.split(':')[1],10)));
  }
}

function buildMusicCard(){
  var d = document.createElement('div');
  d.className = 'mCard';
  var h = '';
  h += '<div class="mEyebrow">' + CONFIG.musicEyebrow + '</div>';
  h += '<div class="disc"></div>';
  h += '<h2>' + CONFIG.musicTitle + '</h2>';
  h += '<p>' + CONFIG.musicArtist + '</p>';
  d.innerHTML = h;
  return d;
}

function buildLetterCard(){
  var d = document.createElement('div');
  d.className = 'lCard';
  var h = '';
  h += '<div class="lStamp">' + CONFIG.letterStamp + '</div>';
  h += '<div class="lEyebrow">' + CONFIG.letterEyebrow + '</div>';
  h += '<h2>' + CONFIG.letterTitle + '</h2>';
  for(var i=0;i<CONFIG.letterBody.length;i++){
    h += '<p>' + CONFIG.letterBody[i] + '</p>';
  }
  h += '<div class="lRule"></div>';
  h += '<div class="lSignLabel">' + CONFIG.letterSignLabel + '</div>';
  h += '<div class="lSign">' + CONFIG.letterSign + '</div>';
  d.innerHTML = h;
  return d;
}

function buildPhotoCard(n){
  var d = document.createElement('div');
  d.className = 'pCard';

  var frame = document.createElement('div');
  frame.className = 'pFrame hidden';

  var miss = document.createElement('div');
  miss.className = 'pMiss hidden';
  miss.innerHTML = 'Foto image' + n + '.jpg belum ada di folder ini.';

  var img = new Image();
  img.alt = '';
  img.onload  = function(){ frame.classList.remove('hidden'); };
  img.onerror = function(){ miss.classList.remove('hidden'); };
  img.src = CONFIG.ASSET_BASE + 'image' + n + '.jpg';
  frame.appendChild(img);

  var cap = document.createElement('div');
  cap.className = 'pCap';
  var txt = CONFIG.photoCaptions[n-1] || '';
  var dt  = CONFIG.photoDates[n-1] || '';
  var ch = '<div class="k">' + txt + '</div>';
  if(dt){ ch += '<div class="d">' + dt + '</div>'; }
  cap.innerHTML = ch;

  d.appendChild(frame);
  d.appendChild(miss);
  d.appendChild(cap);
  return d;
}

/* ---------- overlay ---------- */
function openOverlay(){
  state.overlayOpen = true;
  overlay.classList.remove('hidden');
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ overlay.classList.add('show'); });
  });
  hint.style.opacity = '0';
}
function closeOverlay(){
  overlay.classList.remove('show');
  setTimeout(function(){
    overlay.classList.add('hidden');
    card.innerHTML = '';
    state.overlayOpen = false;
    hint.style.opacity = '1';
    knob.classList.add('ready');
    if(state.spin >= prizes.length){ setHint('Putar lagi, tinggal pestanya'); }
    else { setHint('Putar sekali lagi'); }
  }, 400);
}

/* ---------- reset ---------- */
function resetAll(){
  state.spin = 0;
  state.busy = false;
  state.capsuleReady = false;
  clearTimeout(state.toastTimer);
  toast.classList.remove('show');
  capsule.classList.add('hidden');
  capsule.classList.remove('open','landed','wiggle','dropping');
  flap.classList.remove('open');
  globe.classList.remove('churn');
  globeWrap.classList.remove('churn');
  knob.classList.remove('turn');
  knob.classList.add('ready');
  resetBtn.classList.add('hidden');
  if(state.overlayOpen){ closeOverlay(); }
  buildBalls();
  setHint('Putar tuasnya');
  sndChime([392, 523.25]);
}

/* =========================================================
   EVENTS
   ========================================================= */
knob.addEventListener('click', doSpin);
capsule.addEventListener('click', openCapsule);
closeBtn.addEventListener('click', closeOverlay);
resetBtn.addEventListener('click', resetAll);
overlay.addEventListener('click', function(e){ if(e.target === overlay){ closeOverlay(); } });

nowP.addEventListener('click', function(){
  if(bgm.paused){ bgm.play(); nowP.classList.remove('paused'); }
  else { bgm.pause(); nowP.classList.add('paused'); }
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && state.overlayOpen){ closeOverlay(); }
});

/* =========================================================
   BOOT
   ========================================================= */
applyConfig();
buildPrizeList();
buildBalls();
fitMachine();
sizeFX();
tick();
</script>
</body>
</html>
